<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient registration | MediKiosk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-body">
    <div class="login-wrap" style="max-width:720px">
        <div class="login-panel">
            <h1>Patient registration</h1>
            <p class="login-tag">Create a kiosk account. This is not ABDM authentication.</p>
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
            <form method="post" novalidate>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Username</label>
                        <input class="form-control" name="username" required value="{{ form.username if form }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Email</label>
                        <input class="form-control" type="email" name="email" required value="{{ form.email if form }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Password</label>
                        <input class="form-control" type="password" name="password" required minlength="6">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Full name</label>
                        <input class="form-control" name="full_name" required value="{{ form.full_name if form }}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Age</label>
                        <input class="form-control" type="number" name="age" min="0" max="130" value="{{ form.age if form }}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Date of birth</label>
                        <input class="form-control" type="date" name="date_of_birth" value="{{ form.date_of_birth if form }}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Gender</label>
                        <select class="form-select" name="gender" required>
                            <option value="">Select</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Phone</label>
                        <input class="form-control" name="phone" required value="{{ form.phone if form }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Preferred language</label>
                        <select class="form-select" name="preferred_language">
                            <option value="en">English</option>
                            <option value="hi">Hindi</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Address</label>
                        <textarea class="form-control" name="address" required rows="2">{{ form.address if form }}</textarea>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Emergency contact name</label>
                        <input class="form-control" name="emergency_contact_name" value="{{ form.emergency_contact_name if form }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Emergency contact phone</label>
                        <input class="form-control" name="emergency_contact_phone" value="{{ form.emergency_contact_phone if form }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">ABHA ID (optional, demo)</label>
                        <input class="form-control" name="abha_id" value="{{ form.abha_id if form }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Aadhaar (DEMO / mock only)</label>
                        <input class="form-control" name="aadhaar_demo" placeholder="Do not use a real Aadhaar" value="{{ form.aadhaar_demo if form }}">
                    </div>
                </div>
                <button class="btn btn-primary w-100 mt-4" type="submit">Create patient account</button>
            </form>
            <p class="mt-3 mb-0"><a href="{{ url_for('auth.login') }}">Back to sign in</a></p>
        </div>
    </div>
</body>
</html>
